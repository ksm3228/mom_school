<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어머니학교 신청자 명단</title>
<style>
:root{--bg:#f7f4f1;--card:#fff;--ink:#2a2523;--mute:#857a74;--line:#e8e1db;--accent:#b0485c;--accent-soft:#f6e7ea;--ok:#2f7d55;--ok-soft:#e4f3ea;--warn:#c0392b}
*{box-sizing:border-box}
[hidden]{display:none!important}  
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px -16px 10px;padding:16px 16px 6px}
.top .tools{margin-bottom:0}
/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.box h1{font-size:20px;margin:0 0 6px}
.box p{color:var(--mute);margin:0 0 18px;font-size:14px}
.box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:10px;text-align:center}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.on{background:var(--ok)}
#loginMsg{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
/* 본문 */
#app{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:20px;margin:0}
#status{color:var(--mute);font-size:12px}
.actions{display:flex;gap:8px}
.actions .btn{padding:8px 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px;margin-top:2px}
.stat span{color:var(--mute);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#warn{color:var(--warn);font-size:13px;margin-bottom:8px}
#editBanner{display:none;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
body.editing #editBanner{display:block}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#faf8f6;font-size:13px;color:var(--mute);font-weight:600;position:sticky;top:0}
td.c,th.c{text-align:center}
tr.paid td{background:var(--ok-soft)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);vertical-align:middle}
input[type=checkbox]:disabled{opacity:.85;cursor:default}
td a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--mute)}
.fee{font-variant-numeric:tabular-nums}
.fee.ds{color:var(--accent);font-weight:600}
.num{color:var(--mute);font-size:12px}
td input.t{width:100%;min-width:60px;padding:5px 6px;border:1px solid var(--accent);border-radius:6px;font-size:14px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:12px;margin-right:3px}
.sbtn.save{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;color:var(--mute);padding:28px}
.editcol{display:none}
body.editing .editcol{display:table-cell}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>어머니학교 신청자 명단</h1>
    <p>접속 비밀번호를 입력하세요</p>
    <input id="pw" type="text" placeholder="비밀번호" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn full" id="loginBtn">입장</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
  <header>
    <div>
      <h1>어머니학교 신청자 명단</h1>
      <div id="status">불러오는 중...</div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="refreshBtn">새로고침</button>
      <button class="btn" id="editBtn">편집</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="warn"></div>
  <div id="editBanner">편집 모드입니다. 체크는 즉시 저장되고, 내용 수정은 각 행의 [수정] 버튼으로 할 수 있습니다.</div>

  <div class="tools">
    <input id="q" placeholder="이름·전화·교회 검색">
    <button class="chip on" data-f="all">전체</button>
    <button class="chip" data-f="nosms">문자 미연락</button>
    <button class="chip" data-f="nopaid">미입금</button>
  </div>
</div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th class="c">문자</th><th class="c">입금</th><th class="c">#</th>
          <th>이름</th><th>나이</th><th>직분</th><th>전화번호</th><th>교회</th><th>회비</th>
          <th class="editcol"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyCDJoDdXcI886Yo4NEXutDifuX4xUj5erGsV1k7C1eQAlPvwN_qPCaIJrrQDrYjrIeLg/exec';
const FEE_DS = 60000, FEE_OTHER = 120000;
const REFRESH_MS = 20000;

let viewPw = '', editPw = '', rows = [], editingRow = null, filter = 'all', busy = 0, timer = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fee = ch => /동신/.test(ch || '') ? FEE_DS : FEE_OTHER;
const won = n => n.toLocaleString('ko-KR') + '원';

async function api(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}

async function login(pwArg) {
  const pw = (pwArg ?? $('#pw').value).trim();
  if (!pw) return;
  $('#loginMsg').style.color = 'var(--mute)';
  $('#loginMsg').textContent = '확인 중...';
  try {
    const d = await api({ action: 'list', pw });
    if (!d.ok) {
      $('#loginMsg').style.color = 'var(--warn)';
      $('#loginMsg').textContent = '비밀번호가 틀렸습니다.';
      try { localStorage.removeItem('vpw'); } catch (e) {}
      return;
    }
    viewPw = pw;
    try { localStorage.setItem('vpw', pw); } catch (e) {}
    $('#login').hidden = true;
    $('#app').hidden = false;
    apply(d);
    clearInterval(timer);
    timer = setInterval(load, REFRESH_MS);
  } catch (e) {
    $('#loginMsg').style.color = 'var(--warn)';
    $('#loginMsg').textContent = '서버 연결에 실패했습니다.';
  }
}

async function load(force) {
  if (!force && (editingRow !== null || busy > 0)) return;
  try {
    const d = await api({ action: 'list', pw: viewPw });
    if (d.ok && (force || (editingRow === null && busy === 0))) apply(d);
  } catch (e) {
    $('#status').textContent = '갱신 실패 – 잠시 후 다시 시도합니다';
  }
}

function apply(d) {
  if ((!d.rows || !d.rows.length) && rows.length) return;
  rows = d.rows || [];
  render();
  $('#status').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR') + ' · ' + (REFRESH_MS / 1000) + '초마다 자동 갱신';
  const map = { name: '이름', age: '나이', role: '직분', phone: '전화번호', church: '교회' };
  $('#warn').textContent = d.missing && d.missing.length ? '시트에서 찾지 못한 열: ' + d.missing.map(k => map[k]).join(', ') : '';
}

function stats() {
  const n = rows.length;
  const sms = rows.filter(r => r.sms).length;
  const paid = rows.filter(r => r.paid);
  const ds = rows.filter(r => fee(r.church) === FEE_DS).length;
  const total = rows.reduce((s, r) => s + fee(r.church), 0);
  const got = paid.reduce((s, r) => s + fee(r.church), 0);
  $('#stats').innerHTML = `
    <div class="stat"><span>신청자</span><b>${n}명</b><span>동신 ${ds} · 타교회 ${n - ds}</span></div>
    <div class="stat"><span>문자 연락</span><b>${sms} / ${n}</b><span>미연락 ${n - sms}명</span></div>
    <div class="stat"><span>회비 입금</span><b>${paid.length} / ${n}</b><span>미입금 ${n - paid.length}명</span></div>
    <div class="stat"><span>입금액 / 예정액</span><b>${won(got)}</b><span>총 ${won(total)} · 남은 ${won(total - got)}</span></div>`;
}

function render() {
  const q = $('#q').value.trim();
  let list = rows.filter(r => !q || [r.name, r.phone, r.church, r.role].join(' ').includes(q));
  if (filter === 'nosms') list = list.filter(r => !r.sms);
  if (filter === 'nopaid') list = list.filter(r => !r.paid);
  const ed = !!editPw;
  $('#tbody').innerHTML = list.map(r => {
    const f = fee(r.church);
    const dis = ed ? '' : 'disabled';
    if (ed && editingRow === r.row) {
      return `<tr data-row="${r.row}">
        <td class="c"><input type="checkbox" data-f="sms" ${r.sms ? 'checked' : ''}></td>
        <td class="c"><input type="checkbox" data-f="paid" ${r.paid ? 'checked' : ''}></td>
        <td class="c num">${rows.indexOf(r) + 1}</td>
        <td><input class="t" data-k="name" value="${esc(r.name)}"></td>
        <td><input class="t" data-k="age" value="${esc(r.age)}" style="min-width:45px"></td>
        <td><input class="t" data-k="role" value="${esc(r.role)}"></td>
        <td><input class="t" data-k="phone" value="${esc(r.phone)}" inputmode="tel" style="min-width:120px"></td>
        <td><input class="t" data-k="church" value="${esc(r.church)}"></td>
        <td class="fee">${won(f)}</td>
        <td class="editcol"><button class="sbtn save">저장</button><button class="sbtn cancel">취소</button></td>
      </tr>`;
    }
    const tel = r.phone.replace(/[^0-9+]/g, '');
    return `<tr data-row="${r.row}" class="${r.paid ? 'paid' : ''}">
      <td class="c"><input type="checkbox" data-f="sms" ${r.sms ? 'checked' : ''} ${dis}></td>
      <td class="c"><input type="checkbox" data-f="paid" ${r.paid ? 'checked' : ''} ${dis}></td>
      <td class="c num">${rows.indexOf(r) + 1}</td>
      <td><b>${esc(r.name)}</b></td>
      <td>${esc(r.age)}</td>
      <td>${esc(r.role)}</td>
      <td>${tel ? `<a href="tel:${tel}">${esc(r.phone)}</a>` : ''}</td>
      <td>${esc(r.church)}</td>
      <td class="fee ${f === FEE_DS ? 'ds' : ''}">${won(f)}</td>
      <td class="editcol"><button class="sbtn edit">수정</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" class="empty">표시할 명단이 없습니다</td></tr>';
  stats();
}

async function update(r, updates) {
  busy++;
  try {
    const d = await api({ action: 'update', epw: editPw, row: r.row, origName: r.name, updates });
    if (!d.ok) {
      alert(d.error === 'changed' ? '그 사이 시트 내용이 바뀌었습니다. 새로고침 후 다시 시도하세요.'
          : d.error === 'auth' ? '편집 권한이 없습니다.' : '저장 실패: ' + d.error);
      return false;
    }
    Object.assign(r, updates);
    return true;
  } catch (e) {
    alert('저장 실패 (네트워크 오류)');
    return false;
  } finally {
    busy--;
  }
}

$('#tbody').addEventListener('change', async e => {
  const cb = e.target;
  if (cb.type !== 'checkbox' || !editPw) return;
  const tr = cb.closest('tr');
  const r = rows.find(x => x.row === Number(tr.dataset.row));
  if (!r) return;
  const f = cb.dataset.f, val = cb.checked;
  cb.disabled = true;
  const ok = await update(r, { [f]: val });
  if (!ok) cb.checked = !val;
  cb.disabled = false;
  if (editingRow === null) render(); else stats();
});

$('#tbody').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const tr = b.closest('tr');
  const r = rows.find(x => x.row === Number(tr.dataset.row));
  if (!r) return;
  if (b.classList.contains('edit')) {
    editingRow = r.row; render();
  } else if (b.classList.contains('cancel')) {
    editingRow = null; render();
  } else if (b.classList.contains('save')) {
    const updates = {};
    tr.querySelectorAll('input.t').forEach(i => {
      const v = i.value.trim();
      if (v !== r[i.dataset.k]) updates[i.dataset.k] = v;
    });
    if (updates.name === '') { alert('이름은 비울 수 없습니다.'); return; }
    if (!Object.keys(updates).length) { editingRow = null; render(); return; }
    b.disabled = true; b.textContent = '저장 중';
    const ok = await update(r, updates);
    if (ok) { editingRow = null; render(); }
    else { b.disabled = false; b.textContent = '저장'; }
  }
});

$('#editBtn').onclick = async () => {
  if (editPw) {
    editPw = ''; editingRow = null;
    document.body.classList.remove('editing');
    $('#editBtn').textContent = '편집'; $('#editBtn').classList.remove('on');
    render(); return;
  }
  const p = prompt('편집 비밀번호를 입력하세요');
  if (!p) return;
  try {
    const d = await api({ action: 'login', epw: p.trim() });
    if (!d.ok) { alert('편집 비밀번호가 틀렸습니다.'); return; }
    editPw = p.trim();
    document.body.classList.add('editing');
    $('#editBtn').textContent = '편집 종료'; $('#editBtn').classList.add('on');
    render();
  } catch (e) { alert('서버 연결 실패'); }
};

$('#refreshBtn').onclick = () => { editingRow = null; load(true); };
$('#loginBtn').onclick = () => login();
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#q').addEventListener('input', () => { if (editingRow === null) render(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f; if (editingRow === null) render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && viewPw) load(); });

try { const s = localStorage.getItem('vpw'); if (s) login(s); } catch (e) {}
</script>
</body>
</html>
