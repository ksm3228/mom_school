<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>신청자 명단</title>
<style>
:root{--bg:#f7f4f1;--card:#fff;--ink:#2a2523;--mute:#857a74;--line:#e8e1db;--accent:#b0485c;--accent-soft:#f6e7ea;--ok:#2f7d55;--ok-soft:#e4f3ea;--warn:#c0392b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer}
/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.box h1{font-size:20px;margin:0 0 6px}
.box p{color:var(--mute);margin:0 0 18px;font-size:14px}
.box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:10px;text-align:center}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.on{background:var(--ok)}
#loginMsg{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
/* 본문 */
#app{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:20px;margin:0}
#status{color:var(--mute);font-size:12px}
.actions{display:flex;gap:8px}
.actions .btn{padding:8px 12px;font-size:14px}
td.x{white-space:normal;min-width:170px;max-width:340px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
.mbox h3{margin:0 0 4px;font-size:16px}
.mhint{margin:0 0 10px;color:var(--mute);font-size:13px}
.crow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.nm{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.qa{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;white-space:pre-wrap;word-break:break-word}
.qa small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.mbox.wide{max-width:560px}
.mbox select{width:100%;padding:8px;font-size:14px;margin:6px 0;border:1px solid var(--line);border-radius:8px}
.acct{position:relative}
.actions .iconbtn{padding:8px 10px;font-size:16px;line-height:1}
.acctmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:150px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;text-align:center}
.acctinfo{font-size:12px;color:var(--mute)}
.acctinfo b{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:4px}
.badge:empty{display:none}
.badge.admin{background:var(--accent);color:#fff}
.badge.guest{background:var(--line);color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;color:var(--ink)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tabtools{display:none;gap:6px;flex-wrap:wrap;margin-bottom:10px}
body.editing.isadmin .tabtools{display:flex}
.tabtools .btn{padding:6px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px;margin-top:2px}
.stat span{color:var(--mute);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#warn{color:var(--warn);font-size:13px;margin-bottom:8px}
#editBanner{display:none;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
body.editing #editBanner{display:block}
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px -16px 10px;padding:16px 16px 6px}
.top .tools{margin-bottom:0}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#faf8f6;font-size:13px;color:var(--mute);font-weight:600;position:sticky;top:0}
td.c,th.c{text-align:center}
tr.paid td{background:var(--ok-soft)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);vertical-align:middle}
input[type=checkbox]:disabled{opacity:.85;cursor:default}
td a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--mute)}
td a.ph{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;margin-left:4px;background:#fff}
td a.ph.call{color:var(--ok);border-color:var(--ok)}
td a.ph.msg{color:var(--accent);border-color:var(--accent)}
td input.note{width:100%;min-width:170px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;color:var(--ink)}
td input.note:focus{border-color:var(--accent);outline:none}
.fee{font-variant-numeric:tabular-nums}
.fee.ds{color:var(--accent);font-weight:600}
.num{color:var(--mute);font-size:12px}
td input.t{width:100%;min-width:60px;padding:5px 6px;border:1px solid var(--accent);border-radius:6px;font-size:14px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:12px;margin-right:3px}
.sbtn.save{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;color:var(--mute);padding:28px}
.editcol{display:none}
body.editing .editcol{display:table-cell}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1 id="loginTitle">신청자 명단</h1>
    <p>접속 비밀번호를 입력하세요</p>
    <input id="pw" type="text" placeholder="비밀번호" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn full" id="loginBtn">입장</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div class="modal" id="colModal" hidden>
  <div class="mbox">
    <h3>표시할 열 선택</h3>
    <p class="mhint">체크한 열이 표에 표시됩니다. (문자, 비고, 설문 질문·응답 등)</p>
    <div id="colList"></div>
    <div class="mbtns">
      <button class="btn ghost" id="colCancel">취소</button>
      <button class="btn" id="colSave">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="detModal" hidden>
  <div class="mbox wide">
    <h3 id="detName"></h3>
    <p class="mhint" id="detSub"></p>
    <div id="detList"></div>
    <div class="mbtns"><button class="btn" id="detClose">닫기</button></div>
  </div>
</div>

<div class="modal" id="qModal" hidden>
  <div class="mbox wide">
    <h3>질문 모아보기</h3>
    <select id="qSel"></select>
    <p class="mhint" id="qCnt"></p>
    <div id="qList"></div>
    <div class="mbtns"><button class="btn" id="qClose">닫기</button></div>
  </div>
</div>

<div class="modal" id="dlModal" hidden>
  <div class="mbox">
    <h3>다운로드</h3>
    <p class="mhint">내보낼 내용을 선택하세요.</p>
    <label class="crow"><input type="radio" name="dlm" value="roster" checked> <span>명단만</span></label>
    <label class="crow" id="dlQ1"><input type="radio" name="dlm" value="both"> <span>명단 + 사전질문</span></label>
    <label class="crow" id="dlQ2"><input type="radio" name="dlm" value="q"> <span>사전질문만</span></label>
    <div class="mbtns">
      <button class="btn ghost" id="dlCancel">취소</button>
      <button class="btn" id="dlGo">다운로드</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
  <header>
    <div>
      <h1><span id="appTitle">신청자 명단</span><span id="roleBadge" class="badge"></span> <small style="font-size:11px;color:var(--mute);font-weight:400">v2.8</small></h1>
      <div id="status">불러오는 중...</div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="qBtn">질문</button>
      <button class="btn ghost" id="shareBtn">다운로드</button>
      <button class="btn" id="editBtn">편집</button>
      <div class="acct" id="acct">
        <button class="btn ghost iconbtn" id="acctBtn" aria-label="계정">👤</button>
        <div class="acctmenu" id="acctMenu" hidden>
          <div class="acctinfo">로그인 계정<b id="acctRole">-</b></div>
          <button class="btn ghost" id="logoutBtn">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="tabtools">
    <button class="btn ghost" id="addTabBtn">+ 새 탭</button>
    <button class="btn ghost" id="renameTabBtn">탭 이름 수정</button>
    <button class="btn ghost" id="linkTabBtn">시트 연동</button>
    <button class="btn ghost" id="accessBtn">공개 설정</button>
    <button class="btn ghost" id="titleBtn">제목 수정</button>
    <button class="btn ghost" id="payBtn">입금 관리</button>
    <button class="btn ghost" id="colsBtn">표시 열 설정</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="warn"></div>
  <div id="editBanner">편집 모드입니다. 체크는 즉시 저장되고, 내용 수정은 각 행의 [수정] 버튼으로 할 수 있습니다.</div>

  <div class="tools">
    <input id="q" placeholder="이름·전화·내용 검색">
    <button class="chip on" data-f="all">전체</button>
    <button class="chip" data-f="nosms">문자 미연락</button>
    <button class="chip" data-f="nopaid">미입금</button>
  </div>
  </div>

  <div class="wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyCDJoDdXcI886Yo4NEXutDifuX4xUj5erGsV1k7C1eQAlPvwN_qPCaIJrrQDrYjrIeLg/exec';
const FEE_DS = 60000, FEE_OTHER = 120000;
const REFRESH_MS = 20000;

let viewPw = '', editPw = '', notePw = '', rows = [], tabs = [], curTab = '', editingRow = null, filter = 'all', busy = 0, timer = null;
try { notePw = localStorage.getItem('epw') || ''; curTab = localStorage.getItem('tab') || ''; } catch (e) {}
const curObj = () => tabs.find(t => t.id === curTab) || tabs[0] || { id: '', name: '', linked: true };
let stale = false, loading = false, isAdmin = false, pageTitle = '신청자 명단', xcols = [], miss = [];
function setTitle(t) {
  if (!t) return;
  pageTitle = t;
  document.getElementById('loginTitle').textContent = t;
  document.getElementById('appTitle').textContent = t;
  document.title = t;
  try { localStorage.setItem('titleC', t); } catch (e) {}
}
try { setTitle(localStorage.getItem('titleC')); } catch (e) {}
function setRole(admin) {
  const el = document.getElementById('roleBadge');
  el.textContent = admin ? '관리자' : '게스트';
  el.className = 'badge ' + (admin ? 'admin' : 'guest');
  try { localStorage.setItem('roleC', admin ? 'admin' : 'guest'); } catch (e) {}
}
const saveCache = (id, d) => { try { localStorage.setItem('c_' + id, JSON.stringify({ rows: d.rows || [], cols: d.xcols || [], miss: d.missing || [] })); } catch (e) {} };
const loadCache = id => { try { const s = localStorage.getItem('c_' + id); return s ? JSON.parse(s) : null; } catch (e) { return null; } };
const $ = s => document.querySelector(s);
const noteActive = () => !!(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('note'));
const noteTd = r => `<td><input class="note" value="${esc(r.note)}" maxlength="200"></td>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fee = ch => /동신/.test(ch || '') ? FEE_DS : FEE_OTHER;
const won = n => n.toLocaleString('ko-KR') + '원';

async function api(body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl.signal });
    const txt = await r.text();
    try { return JSON.parse(txt); }
    catch (e) { throw new Error('JSON 아님: ' + txt.slice(0, 120)); }
  } finally { clearTimeout(t); }
}

async function login(pwArg) {
  const pw = (pwArg ?? $('#pw').value).trim();
  if (!pw) return;
  $('#loginMsg').style.color = 'var(--mute)';
  $('#loginMsg').textContent = '확인 중...';
  try {
    const d = await api({ action: 'list', pw, tab: curTab });
    if (!d.ok) {
      $('#loginMsg').style.color = 'var(--warn)';
      $('#loginMsg').textContent = d.error === 'auth' ? '비밀번호가 틀렸습니다.' : '오류: ' + d.error;
      if (d.error === 'auth') {
        try { localStorage.removeItem('vpw'); } catch (e) {}
        $('#app').hidden = true; $('#login').hidden = false;
      }
      return;
    }
    if (!d.tabs) {
      $('#loginMsg').style.color = 'var(--warn)';
      $('#loginMsg').textContent = 'Apps Script를 새 버전으로 배포해 주세요.';
      return;
    }
    viewPw = pw;
    try { localStorage.setItem('vpw', pw); } catch (e) {}
    $('#login').hidden = true;
    $('#app').hidden = false;
    curTab = d.tab;
    try { localStorage.setItem('tab', curTab); } catch (e) {}
    apply(d);
    clearInterval(timer);
    timer = setInterval(load, REFRESH_MS);
  } catch (e) {
    if (!$('#app').hidden) {
      $('#status').textContent = '서버 연결 실패 – 저장된 목록을 표시 중입니다 (자동으로 다시 시도합니다)';
      setTimeout(() => { if (viewPw) login(pw); }, 5000);
      return;
    }
    $('#loginMsg').style.color = 'var(--warn)';
    $('#loginMsg').textContent = '서버 연결 실패: ' + (e.name === 'AbortError' ? '응답 시간 초과' : e.message);
  }
}

async function load(force) {
  if (!force && (editingRow !== null || busy > 0 || noteActive())) return;
  const tabId = curTab;
  try {
    const d = await api({ action: 'list', pw: viewPw, tab: tabId });
    if (tabId !== curTab) return;
    if (!d.ok) { $('#status').textContent = '시트를 읽지 못했습니다: ' + d.error; loading = false; if (!rows.length) render(); return; }
    if (force || (editingRow === null && busy === 0 && !noteActive())) apply(d);
  } catch (e) {
    $('#status').textContent = '갱신 실패 – 잠시 후 다시 시도합니다';
    loading = false; if (!rows.length) render();
  }
}

function renderTabs() {
  $('#tabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.id === curTab ? 'on' : ''}" data-id="${esc(t.id)}">${t.access === 'admin' ? '🔒 ' : ''}${esc(t.name)}</button>`).join('');
  const cur = curObj();
  $('#accessBtn').textContent = cur.access === 'admin' ? '🔒 관리자 전용 → 공개로' : '공개 중 → 관리자 전용으로';
  $('#payBtn').textContent = cur.payment === false ? '입금 관리: 꺼짐 → 켜기' : '입금 관리: 사용 중 → 끄기';
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  try { localStorage.setItem('tab', id); } catch (e) {}
  editingRow = null;
  const c = loadCache(id);
  rows = c ? c.rows : []; stale = !!c; loading = true;
  xcols = c ? (c.cols || []) : []; miss = c ? (c.miss || []) : [];
  $('#q').value = '';
  $('#status').textContent = '불러오는 중...';
  renderTabs(); render();
  load(true);
}

function apply(d) {
  isAdmin = !!d.admin;
  document.body.classList.toggle('isadmin', isAdmin);
  setRole(isAdmin);
  if (d.title) setTitle(d.title);
  if (d.tabs) {
    tabs = d.tabs; renderTabs();
    try {
      localStorage.setItem('tabsC', JSON.stringify(tabs));
      const ids = tabs.map(t => 'c_' + t.id);
      Object.keys(localStorage).filter(k => k.startsWith('c_') && !ids.includes(k)).forEach(k => localStorage.removeItem(k));
    } catch (e) {}
  }
  if ((!d.rows || !d.rows.length) && rows.length && !d.unlinked && !stale) return;
  rows = d.rows || []; stale = false; loading = false;
  xcols = d.xcols || []; miss = d.missing || [];
  saveCache(curTab, d);
  render();
  $('#status').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');
  const map = { name: '이름', age: '나이', role: '직분', phone: '전화번호', church: '교회', note: '비고' };
  const need = (d.missing || []).filter(k => k === 'name' || k === 'phone');
  $('#warn').textContent = need.length ? '시트에서 찾지 못한 열: ' + need.map(k => map[k]).join(', ') : '';
}

const isPay = () => curObj().payment !== false;
const isSms = () => curObj().sms !== false;
const isNote = () => curObj().note !== false;
const isTs = h => /타임스탬프|timestamp/i.test(h);
const hasCol = k => !miss.includes(k);
function shownX() {
  const hide = curObj().hide || xcols.filter(isTs);
  return xcols.map((h, i) => ({ h, i })).filter(c => !hide.includes(c.h));
}

function stats() {
  const n = rows.length;
  const sms = rows.filter(r => r.sms).length;
  const card = (a, b, c) => `<div class="stat"><span>${a}</span><b>${b}</b><span>${c}</span></div>`;
  const smsCard = isSms() ? card('문자 연락', sms + ' / ' + n, '미연락 ' + (n - sms) + '명') : '';
  if (!isPay()) {
    $('#stats').innerHTML = card('신청자', n + '명', '참석 인원') + smsCard;
    return;
  }
  const paid = rows.filter(r => r.paid);
  const ds = rows.filter(r => fee(r.church) === FEE_DS).length;
  const total = rows.reduce((s, r) => s + fee(r.church), 0);
  const got = paid.reduce((s, r) => s + fee(r.church), 0);
  $('#stats').innerHTML =
    card('신청자', n + '명', hasCol('church') ? `동신 ${ds} · 타교회 ${n - ds}` : '&nbsp;') +
    smsCard +
    card('회비 입금', paid.length + ' / ' + n, '미입금 ' + (n - paid.length) + '명') +
    card('입금액 / 예정액', won(got), `총 ${won(total)} · 남은 ${won(total - got)}`);
}

function filtered() {
  const q = $('#q').value.trim();
  let list = rows.filter(r => !q || [r.name, r.phone, r.church, r.role, r.note, ...(r.x || [])].join(' ').includes(q));
  if (filter === 'nosms' && isSms()) list = list.filter(r => !r.sms);
  if (filter === 'nopaid' && isPay()) list = list.filter(r => !r.paid);
  return list;
}

function render() {
  const pay = isPay();
  const np = document.querySelector('.chip[data-f="nopaid"]');
  np.hidden = !pay;
  const sms = isSms();

async function update(r, updates) {
  busy++;
  try {
    const d = await api({ action: 'update', pw: viewPw, epw: editPw || notePw || (isAdmin ? viewPw : ''), tab: curTab, row: r.row, origName: r.name, updates });
    if (!d.ok && d.error === 'auth') { notePw = ''; try { localStorage.removeItem('epw'); } catch (e) {} }
    if (!d.ok) {
      alert(d.error === 'changed' ? '그 사이 시트 내용이 바뀌었습니다. 새로고침 후 다시 시도하세요.'
          : d.error === 'auth' ? '편집 권한이 없습니다.' : '저장 실패: ' + d.error);
      return false;
    }
    Object.assign(r, updates);
    return true;
  } catch (e) {
    alert('저장 실패 (네트워크 오류)');
    return false;
  } finally {
    busy--;
  }
}

async function doShare(mode) {
  const list = filtered();
  const label = { all: '전체', nosms: '문자 미연락', nopaid: '미입금' }[filter];
  const pay = isPay();
  const paidN = rows.filter(r => r.paid).length;
  const tn = curObj().name || '신청자';
  const sx = shownX();
  const rosterLine = (r, i) => (pay ? (r.paid ? '✅ ' : '⬜ ') : '') + [i + 1, r.name, r.age, r.role, r.phone, r.church].filter(Boolean).join(' ');
  const qLines = r => sx.map(c => [c.h, String((r.x || [])[c.i] || '').trim()]).filter(a => a[1]).map(a => `   Q. ${a[0]}\n   A. ${a[1]}`);
  let text, suffix;
  if (mode === 'q') {
    suffix = '사전질문';
    text = `${tn} 사전질문 (${label} ${list.length}명)\n\n` + list.map((r, i) => {
      const q = qLines(r);
      return `${i + 1}. ${r.name}` + (q.length ? '\n' + q.join('\n') : '\n   (응답 없음)');
    }).join('\n\n');
  } else {
    suffix = mode === 'both' ? '명단_사전질문' : '명단';
    text = `${tn} 명단 (${label} ${list.length}명)\n` +
      (pay ? `전체 ${rows.length}명 중 입금 ${paidN}명 · 미입금 ${rows.length - paidN}명\n✅ 입금 · ⬜ 미입금\n` : '');
    if (mode === 'both') {
      text += '\n' + list.map((r, i) => {
        const q = qLines(r);
        return rosterLine(r, i) + (q.length ? '\n' + q.join('\n') : '');
      }).join('\n\n');
    } else {
      text += list.map(rosterLine).join('\n');
    }
  }
  if (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = `${tn.replace(/[\\/:*?"<>|]/g, '')}_${suffix}_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  alert('파일로 저장하고 클립보드에도 복사했습니다. 카톡에 붙여넣기 하세요.');
}

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f; if (editingRow === null) render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && viewPw) load(); });

api({ action: 'title' }).then(d => { if (d && d.ok) setTitle(d.title); }).catch(() => {});

try {
  const s = localStorage.getItem('vpw');
  if (s) {
    const c = loadCache(curTab), tc = JSON.parse(localStorage.getItem('tabsC') || 'null');
    if (c && tc && tc.length) {
      viewPw = s; tabs = tc; rows = c.rows; stale = true; loading = true;
      xcols = c.cols || []; miss = c.miss || [];
      const rc = localStorage.getItem('roleC');
      isAdmin = rc === 'admin';
      if (rc) { const el = $('#roleBadge'); el.textContent = rc === 'admin' ? '관리자' : '게스트'; el.className = 'badge ' + rc; }
      $('#login').hidden = true; $('#app').hidden = false;
      renderTabs(); render();
      $('#status').textContent = '불러오는 중...';
    }
    login(s);
  }
} catch (e) {}
</script>
</body>
</html>
